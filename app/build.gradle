plugins {
    id 'com.android.application'
}

android {
    namespace 'com.biligate'
    compileSdk 34

    defaultConfig {
        applicationId "com.biligate"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No third-party dependencies on purpose: the app must build offline and
// must not request INTERNET, so nothing can be phoned home.
